name: Deploy

# Cada push a main: pruebas → imagen en ECR → despliegue en la EC2 con SSM Run Command.
# Variables del repositorio (Settings → Secrets and variables → Actions → Variables),
# todas salen de las salidas de la pila infra/uml-studio.yml:
#   AWS_REGION, AWS_ROLE_ARN, ECR_REPOSITORY, DEPLOY_BUCKET, EC2_INSTANCE_ID y APP_NAME (opcional)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC: GitHub obtiene credenciales temporales de AWS, sin claves guardadas

env:
  APP_NAME: ${{ vars.APP_NAME || 'uml-studio' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Publicar y desplegar
    needs: ci
    # Se omite hasta que el repositorio tenga las variables de AWS
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Iniciar sesión en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Construir y subir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir el paquete de despliegue a S3
        run: |
          mkdir bundle
          cp deploy/docker-compose.prod.yml deploy/remote-deploy.sh schema.sql bundle/
          tar -czf bundle.tgz -C bundle .
          aws s3 cp bundle.tgz "s3://${{ vars.DEPLOY_BUCKET }}/backend/${{ github.sha }}.tgz"

      - name: Desplegar en la EC2
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          BUNDLE: s3://${{ vars.DEPLOY_BUCKET }}/backend/${{ github.sha }}.tgz
        run: |
          DIR="/opt/$APP_NAME"
          COMMANDS=$(jq -cn --arg dir "$DIR" --arg bundle "$BUNDLE" --arg image "$IMAGE" \
            --arg region "${{ vars.AWS_REGION }}" --arg app "$APP_NAME" '[
              "set -euo pipefail",
              "mkdir -p \($dir) && cd \($dir)",
              "aws s3 cp \($bundle) - | tar -xz",
              "bash remote-deploy.sh \($image) \($region) \($app)"
            ]')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters "{\"commands\":$COMMANDS,\"executionTimeout\":[\"900\"]}" \
            --query Command.CommandId --output text)
          echo "Comando SSM: $COMMAND_ID"

          # Esperar el resultado y mostrar la salida del script
          STATUS=Pending
          for _ in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Estado: $STATUS"
          test "$STATUS" = Success
